name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: quartz

      - name: Copy vault content into Quartz
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.obsidian' \
            --exclude='.claude' \
            --exclude='quartz.config.ts' \
            vault/ quartz/content/

      - name: Override Quartz config
        run: cp vault/quartz.config.ts quartz/quartz.config.ts

      - name: Build
        run: npx quartz build
        working-directory: quartz

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quartz/public
