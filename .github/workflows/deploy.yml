name: Deploy Quartz to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          path: quartz

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: quartz

      - name: Copy vault content into Quartz
        run: |
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.obsidian' \
            --exclude='.claude' \
            --exclude='quartz.config.ts' \
            --exclude='n-mehraas' \
            vault/ quartz/content/

      - name: Override Quartz config
        run: cp vault/quartz.config.ts quartz/quartz.config.ts

      - name: Build
        run: npx quartz build
        working-directory: quartz

      - name: Install StaticCrypt
        run: npm install -g staticrypt

      - name: Password protect site
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          PASSWORD_STAR_ORIGIN: ${{ secrets.PASSWORD_STAR_ORIGIN }}
          PASSWORD_PROJECTS: ${{ secrets.PASSWORD_PROJECTS }}
          PASSWORD_PROPOSALS: ${{ secrets.PASSWORD_PROPOSALS }}
        run: |
          encrypt_folder() {
            local dir="$1"
            local pass="$2"
            if [ -n "$pass" ] && [ -d "$dir" ]; then
              echo "Encrypting: $dir"
              (cd "$dir" && find . -name "*.html" -print0 | xargs -0 staticrypt --password "$pass" --remember 0 --short -d .)
            fi
          }

          # Site password — root-level pages only (the front door)
          (cd quartz/public && find . -maxdepth 1 -name "*.html" ! -name "404.html" -print0 | \
            xargs -0 staticrypt --password "$SITE_PASSWORD" --remember 0 --short -d .)

          # Per-folder passwords
          encrypt_folder "quartz/public/Star-Origin" "$PASSWORD_STAR_ORIGIN"
          encrypt_folder "quartz/public/Projects"   "$PASSWORD_PROJECTS"
          encrypt_folder "quartz/public/Proposals"  "$PASSWORD_PROPOSALS"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: quartz/public
